<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - Product Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header>
    <div class="logo">🛍️ ShopEase</div>
    <button id="cart-btn" onclick="showCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
  </header>

  <!-- ===================== FILTER SECTION ===================== -->
  <section id="filters">
    <div class="filter-group">
      <label for="category-filter">Category:</label>
      <select id="category-filter">
        <option value="all">All</option>
        <option value="electronics">Electronics</option>
        <option value="clothing">Clothing</option>
        <option value="footwear">Footwear</option>
        <option value="accessories">Accessories</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="price-filter">Max Price:</label>
      <input type="range" id="price-filter" min="0" max="2000" step="100" value="2000">
      <span id="price-value">Up to ₹2000</span>
    </div>
  </section>

  <!-- ===================== PRODUCT GRID ===================== -->
  <main>
    <section id="product-grid"></section>
  </main>

  <!-- ===================== CART SECTION ===================== -->
  <section id="cart-section">
    <h2>Your Cart</h2>
    <div id="cart-container"></div>
    <p id="total-price"></p>
    <div class="cart-actions">
      <button onclick="clearCart()" class="clear-btn">Clear Cart</button>
    </div>
  </section>

  <!-- ===================== FOOTER ===================== -->
  <footer>
    <p>© 2025 ShopEase | Built with 💙 using HTML, CSS, and JS</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
